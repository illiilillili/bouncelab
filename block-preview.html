<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>바운스랩</title>
<!-- 웹 폰트 : 연결을 미리 열고(preconnect), 가장 많이 쓰이는 서브셋을 먼저 받아 둔다(preload)
     — 이유와 보정값은 css/tokens.css 의 @font-face 주석 참고 -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preload" as="font" type="font/woff2" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/packages/pretendard/dist/web/variable/woff2-dynamic-subset/PretendardVariable.subset.91.woff2">
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/tokens.css?v=1789952398399">
<link rel="stylesheet" href="css/style.css?v=1789952398399">
</head>
<body>
<main class="view">
  <div class="blkrow">
    <div class="blk blk--solid" style="--blk: #024E5C"><div class="blk__fill"></div></div>
    <div class="blk blk--corner" style="--blk: #024E5C"><div class="blk__fill"></div></div>
    <div class="blk blk--hollow" style="--blk: #024E5C"><div class="blk__fill"></div></div>
  </div>
</main>
</body>
</html>
