<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>바운스랩 — 컨트롤 GIF 예시</title>
<!-- 웹 폰트 : 연결을 미리 열고(preconnect), 가장 많이 쓰이는 서브셋을 먼저 받아 둔다(preload)
     — 이유와 보정값은 css/tokens.css 의 @font-face 주석 참고 -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preload" as="font" type="font/woff2" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/packages/pretendard/dist/web/variable/woff2-dynamic-subset/PretendardVariable.subset.91.woff2">
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/tokens.css?v=1789957560243">
<style>
  body { margin: 0; background: var(--white); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.62; }
  .wrap { max-width: var(--maxw); margin: 0 auto; padding: clamp(18px, 4vw, 32px) clamp(14px, 4vw, 28px) 48px; }
  h1 { margin: 0 0 6px; font-size: clamp(19px, 3.4vw, 23px); letter-spacing: -.015em; }
  .lead { margin: 0 0 20px; color: var(--text-dim); font-size: 13.5px; max-width: 60ch; }
  .card { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start; padding: 18px; border: 1px solid var(--line); border-radius: var(--r); }
  .frame { position: relative; flex: 0 0 auto; width: 340px; max-width: 100%; min-height: 170px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .frame img { display: none; width: 100%; height: auto; }
  .frame__note { padding: 14px; font-size: 13px; color: var(--text-dim); text-align: center; }
  .main { flex: 1; min-width: 260px; }
  .name { margin: 0 0 6px; font-size: clamp(20px, 3.2vw, 26px); font-weight: 700; letter-spacing: -.02em; }
  .meta { margin: 0 0 14px; font-size: 13px; color: var(--text-dim); }
  .row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin: 7px 0; font-size: 13px; }
  .row b { flex: 0 0 46px; font-weight: 700; color: var(--text-dim); }
  .bar { display: inline-flex; gap: 3px; }
  .bar i { width: 13px; height: 13px; border-radius: 3px; background: var(--lav); }
  .bar i.on { background: var(--teal); }
  .num { font-family: var(--mono); font-size: 14px; }
  .chip { color: inherit; font: inherit; }
  .link { color: var(--teal); }
  .foot { margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--text-dim); }
</style>
</head>
<body>
<div class="wrap">
  <h1>컨트롤 GIF 예시 (1개만)</h1>
  <p class="lead">도감 DB에서 찾은 실제 GIF를 구글 드라이브 주소로 불러옵니다. 이 화면이 잘 보이면 631개 전체에 같은 방식을 적용합니다.</p>

  <div class="card">
    <div class="frame">
      <span class="frame__note" id="note">GIF 불러오는 중… (1.2MB)</span>
      <img id="gif" alt="(3,-1)+(2,1) 점프">
    </div>
    <div class="main">
      <p class="name">(3,-1)+(2,1) 점프</p>
      <div class="row"><b>난이도</b><span class="bar" id="bar"></span><span class="num">5</span></div>
      <div class="row"><b>태그</b><span class="chip">#최댓값</span><span class="chip">#일방통행</span></div>
      <div class="row"><b>재료</b><span class="chip">아무 일회용 블럭</span></div>
      <div class="row"><b>설명</b><span>블럭 끄트머리에서 뛰어줍니다.</span></div>
      <div class="row"><b>원본</b><a class="link" href="https://drive.google.com/file/d/10in1RDxGuzeDSBvvfMbNvTu7npqS_gfM/view" target="_blank" rel="noopener">드라이브에서 보기 ↗</a></div>
    </div>
  </div>

  <p class="foot">자료 출처: 바운스볼 도감 (컨트롤 검색 탭) · 이 페이지는 확인용 예시입니다.</p>
</div>

<script>
  /* 난이도 5 → 막대 10칸 중 5칸 */
  var bar = document.getElementById('bar');
  for (var i = 1; i <= 10; i++) {
    var cell = document.createElement('i');
    if (i <= 5) cell.className = 'on';
    bar.appendChild(cell);
  }

  /* GIF 불러오기: 첫 주소가 막히면 두 번째 주소로 한 번 더 시도 */
  var FILE_ID = '10in1RDxGuzeDSBvvfMbNvTu7npqS_gfM';
  var SOURCES = [
    'https://lh3.googleusercontent.com/d/' + FILE_ID,
    'https://drive.google.com/uc?export=view&id=' + FILE_ID
  ];
  var img = document.getElementById('gif');
  var note = document.getElementById('note');
  var tryIndex = 0;
  img.onload = function () { note.style.display = 'none'; img.style.display = 'block'; };
  img.onerror = function () {
    tryIndex++;
    if (tryIndex < SOURCES.length) { img.src = SOURCES[tryIndex]; return; }
    note.textContent = 'GIF를 불러오지 못했습니다. 드라이브 공유 설정을 확인해 주세요.';
  };
  img.src = SOURCES[0];
</script>
</body>
</html>
